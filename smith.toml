# A plugin is released as a GitHub Release with its .loomp package, never to PyPI.
[projects.speech-to-text]
registry = "none"

[projects.speech-to-text.release]
build = "sh tools/pack-plugin.sh speech-to-text python"
# The build only zips the plugin: the assets job does not install its Python packages.
install = false
assets = ["out/speech-to-text-*.loomp"]
platforms = ["linux-x64"]
