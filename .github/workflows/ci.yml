# Generated by smith from the workspace's projects. `smith add` and `smith ci generate`
# rewrite this file: put your own steps between the smith:slot markers, which are kept.
name: ci

run-name: ${{ inputs.release_bump != '' && format('ci · manual release {0}', inputs.release_bump) || github.event.pull_request.title || 'ci' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      assets_tag:
        description: "Run only the assets job again for this release tag (project@version), from this branch"
        required: false
        default: ""
      assets_source:
        description: "With assets_tag: the code to build. current = the code of this branch as it is now, named with the tag's version (a fix reaches the files, but they carry newer code under an old number). tag = the tag's own commit, the exact code that was released. ask me (refuses) = the run stops and names both choices; it is preselected so that nothing is built from code you did not pick"
        type: choice
        required: true
        default: "ask me (refuses)"
        options:
          - current
          - tag
          - "ask me (refuses)"
      release_bump:
        description: "Release by hand a package no commit releases, as project=patch|minor|major (several: separate with commas). This publishes to the registries, tags HEAD and cannot be undone. Empty: no manual release"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    if: ${{ inputs.assets_tag == '' }}
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check out loomas-apps/Loomas
        uses: actions/checkout@v7
        with:
          repository: loomas-apps/Loomas
          path: Loomas
          ref: 'main'
          token: ${{ secrets.LOOMAS_TOKEN }}
      - name: Export LOOMAS
        shell: bash
        run: echo "LOOMAS=$GITHUB_WORKSPACE/Loomas" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: 'clippy, rustfmt'
      - name: Cache the cargo download store
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: smith-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            smith-cargo-${{ runner.os }}-
      - name: Cache the pip download store
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: smith-pip-${{ runner.os }}-${{ hashFiles('requirements-dev.txt', 'apps/speech-to-text/pyproject.toml') }}
          restore-keys: |
            smith-pip-${{ runner.os }}-
      - name: Install smith
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --index-url https://pypi.org/simple/ monosmith==2.4.0
          smith --version
      - name: Build Loomas
        shell: bash
        working-directory: Loomas
        run: cargo build --release -p loomas-cli
      # smith:slot before-setup
      # smith:slot-end before-setup
      - name: Setup
        run: smith ci setup
      - name: Audit
        run: smith ci audit
      - name: Verify
        run: smith ci verify
      # smith:slot after-verify
      # smith:slot-end after-verify
      - name: Release preview
        if: github.event_name == 'pull_request'
        run: smith release --dry-run --comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_bump != '')) && github.ref_name == 'main'
        run: smith ci pack
      - name: Keep the packed apps (dist/drop as artifact drop)
        uses: actions/upload-artifact@v7
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_bump != '')) && github.ref_name == 'main'
        with:
          name: drop
          path: dist/drop
          if-no-files-found: ignore
      - name: Release
        id: release
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_bump != '')) && github.ref_name == 'main'
        run: |
          if [ -n "$RELEASE_BUMP" ]; then
            smith ci release --bump "$RELEASE_BUMP" --force
          else
            smith ci release
          fi
        env:
          RELEASE_BUMP: ${{ inputs.release_bump }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_bump != '')) && github.ref_name == 'main' && hashFiles('dist/release/**') != ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/release/*/*

  assets:
    needs: ci
    if: ${{ always() && ((needs.ci.outputs.released == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_bump != '')) && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && inputs.assets_tag != '')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: macos-arm64
            os: macos-latest
          - platform: linux-x64
            os: ubuntu-latest
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: macos-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check out loomas-apps/Loomas
        uses: actions/checkout@v7
        with:
          repository: loomas-apps/Loomas
          path: Loomas
          ref: 'main'
          token: ${{ secrets.LOOMAS_TOKEN }}
      - name: Export LOOMAS
        shell: bash
        run: echo "LOOMAS=$GITHUB_WORKSPACE/Loomas" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: 'clippy, rustfmt'
      - name: Install smith
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --index-url https://pypi.org/simple/ monosmith==2.4.0
          smith --version
      - name: Build Loomas
        shell: bash
        working-directory: Loomas
        run: cargo build --release -p loomas-cli
      - name: Setup
        run: smith ci setup --assets
      - name: Build and upload the release files
        run: smith ci assets --tag "$ASSETS_TAG" --source "$ASSETS_SOURCE"
        env:
          ASSETS_TAG: ${{ inputs.assets_tag }}
          ASSETS_SOURCE: ${{ inputs.assets_source }}
          SMITH_PLATFORM: ${{ matrix.platform }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
